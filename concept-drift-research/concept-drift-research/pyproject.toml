[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "concept-drift-research"
version = "1.0.0"
description = "Empirical study of concept drift detection, degradation and recovery in online learning"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "river>=0.22,<0.27",
    "numpy>=1.26,<3",
    "pandas>=2.1,<4",
    "scipy>=1.11,<2",
    "scikit-learn>=1.4,<2",
    "matplotlib>=3.8,<4",
    "seaborn>=0.13,<0.14",
    "statsmodels>=0.14,<0.16",
    "PyYAML>=6",
    "psutil>=5.9",
]

[project.optional-dependencies]
notebook = ["jupyterlab>=4", "nbformat>=5", "nbconvert>=7", "nbclient>=0.10", "ipykernel>=6"]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
